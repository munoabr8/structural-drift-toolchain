name: Structure Validation (diagnostic)

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  validate-structure:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive          # pull submodules
          fetch-depth: 0                 # optional
          # token: ${{ secrets.SUBMODULE_TOKEN }}  # if private submodules (HTTPS)
          # ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}  # if SSH submodules

      # Only needed if you didn't set submodules: recursive
      # - name: Init submodules
      #   run: |
      #     git submodule sync --recursive
      #     git submodule update --init --recursive

      - name: Run structure validator (diagnostic)
        shell: bash
        env:
          MINIMAL_MODE: "1"
          SPEC_SEARCH_PATHS: ".:config:system-test"
          LOG_OUTPUT_FILE: "structure_validator.jsonl"
          LOG_FILE: "structure_validator.log"
        run: |
          set -euo pipefail
          set -x
          echo "PWD=$(pwd)"
          git rev-parse --short HEAD || true
          ls -la
          ls -la system || true
          ls -la config || true

          SCRIPT="system/structure_validator.rf.sh"
          test -f "$SCRIPT"
          chmod +x "$SCRIPT"

          set +e
          "$SCRIPT" --spec structure.spec
          rc=$?
          set -e
          echo "validator rc=$rc"

          echo "--- JSON log ---"
          if [ -f "$LOG_OUTPUT_FILE" ]; then sed -n '1,200p' "$LOG_OUTPUT_FILE"; else echo "(missing)"; fi
          echo "--- TEXT log ---"
          if [ -f "$LOG_FILE" ]; then sed -n '1,200p' "$LOG_FILE"; else echo "(missing)"; fi

          exit $rc

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-validator-logs
          path: |
            structure_validator.jsonl
            structure_validator.log
